[workspace]
members = [
	"crates/core",
	"crates/macros",
	"crates/migrate",
	"examples/drivers",
	"examples/pools",
	"tests/e2e-mysql",
	"tests/e2e-postgres",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.3.1"

[workspace.dependencies]
esql = { path = "." }
esql-core = { path = "crates/core" }
esql-macros = { path = "crates/macros" }
esql-migrate = { path = "crates/migrate" }

base16ct = { version = "0.3.0", features = ["alloc"] }
bb8 = "0.9"
bb8-postgres = "0.9"
deadpool-postgres = "0.14"
futures-util = "0.3.31"
mysql_async = "0.37.0"
proc-macro2 = "1.0"
quote = "1.0.42"
regex = "1.12.2"
rust_decimal = { version = "1.41", default-features = false, features = ["std"] }
serde_json = "1.0"
sha2 = "0.11.0-rc.3"
syn = { version = "2.0", features = ["full"] }
time = "0.3"
tokio = { version = "1.48.0", features = ["full"] }
tokio-postgres = "0.7.15"
uuid = "1"

[features]
derive = [ "dep:esql-macros", "esql-macros/derive" ]
migrate = [ "dep:esql-macros", "dep:esql-migrate", "esql-core/migrate", "esql-macros/migrate" ]
mysql = [ "esql-core/mysql" ]
postgres = [ "esql-core/postgres" ]
with-rust_decimal-1 = [ "esql-core/with-rust_decimal-1" ]
with-serde_json-1 = [ "esql-core/with-serde_json-1" ]
with-time-0_3 = [ "esql-core/with-time-0_3" ]
with-uuid-1 = [ "esql-core/with-uuid-1" ]

[package]
name = "esql"
edition.workspace = true
license.workspace = true
version.workspace = true

# Every feature can be enabled at once, so docs cover the whole surface.
[package.metadata.docs.rs]
all-features = true

[dependencies]
esql-core = { workspace = true }
esql-macros = { workspace = true, optional = true }
esql-migrate = { workspace = true, optional = true }
