[workspace]
members = [
	"crates/core",
	"crates/macros",
	"crates/migrate",
	"examples/drivers",
	"examples/pools",
	"tests/e2e-mysql",
	"tests/e2e-postgres",
]

[workspace.package]
categories = [ "asynchronous", "database" ]
edition = "2024"
keywords = [ "database", "mysql", "postgres", "query-builder", "sql" ]
license = "MIT"
repository = "https://github.com/MDM23/esql"
rust-version = "1.85"
version = "0.4.0"

[workspace.dependencies]
# The version has to be repeated here: `cargo publish` rejects a path
# dependency without one, and it cannot be inherited inside a dependency.
esql = { path = ".", version = "0.4.0" }
esql-core = { path = "crates/core", version = "0.4.0" }
esql-macros = { path = "crates/macros", version = "0.4.0" }
esql-migrate = { path = "crates/migrate", version = "0.4.0" }

base16ct = { version = "0.3.0", features = ["alloc"] }
bb8 = "0.9"
bb8-postgres = "0.9"
deadpool-postgres = "0.14"
futures-util = "0.3.31"
mysql_async = "0.37.0"
proc-macro2 = "1.0"
quote = "1.0.42"
regex = "1.12.2"
rust_decimal = { version = "1.41", default-features = false, features = ["std"] }
serde_json = "1.0"
sha2 = "0.11.0-rc.3"
syn = { version = "2.0", features = ["full"] }
thiserror = "2.0"
time = "0.3"
tokio = { version = "1.48.0", features = ["full"] }
tokio-postgres = "0.7.15"
tracing = { version = "0.1.44", default-features = false, features = ["attributes", "std"] }
uuid = "1"

[features]
derive = [ "dep:esql-macros", "esql-macros/derive" ]
migrate = [ "dep:esql-macros", "dep:esql-migrate", "esql-core/migrate", "esql-macros/migrate" ]
mysql = [ "esql-core/mysql" ]
postgres = [ "esql-core/postgres" ]
tracing = [ "esql-core/tracing", "esql-migrate?/tracing" ]
with-rust_decimal-1 = [ "esql-core/with-rust_decimal-1" ]
with-serde_json-1 = [ "esql-core/with-serde_json-1" ]
with-time-0_3 = [ "esql-core/with-time-0_3" ]
with-uuid-1 = [ "esql-core/with-uuid-1" ]

[package]
name = "esql"
description = "A thin, composable SQL query builder for tokio-postgres and mysql_async"
readme = "README.md"
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# Every feature can be enabled at once, so docs cover the whole surface.
[package.metadata.docs.rs]
all-features = true

[dependencies]
esql-core = { workspace = true }
esql-macros = { workspace = true, optional = true }
esql-migrate = { workspace = true, optional = true }
