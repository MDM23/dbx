name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # No driver at all. This is the docs.rs configuration, and nothing but a
      # dedicated job builds it.
      - name: Clippy (no features)
        run: cargo clippy -p esql -p esql-core --all-targets -- -D warnings

  audit:
    name: Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit

      # Against the lockfile, so what is checked is what is built.
      - name: Audit
        run: cargo audit

  test:
    name: Unit tests (${{ matrix.features }})
    runs-on: ubuntu-latest

    # Both drivers build together, so each entry covers both value encoders.
    # The type features still get a pass each: the encoders match exhaustively,
    # so a variant gated behind one feature is only reachable in a build with
    # exactly that feature on. That gap is what let a broken `mysql` +
    # `with-time-0_3` build ship.
    strategy:
      fail-fast: false
      matrix:
        features:
          - mysql,postgres,migrate
          - mysql,postgres,migrate,with-rust_decimal-1
          - mysql,postgres,migrate,with-serde_json-1
          - mysql,postgres,migrate,with-time-0_3
          - mysql,postgres,migrate,with-uuid-1
          - mysql,migrate
          - postgres,migrate

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Unit tests
        run: cargo test -p esql -p esql-core -p esql-migrate --features ${{ matrix.features }}

  e2e-postgres:
    name: E2E Postgres
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: E2E tests
        run: cargo test -p e2e-postgres
        env:
          POSTGRES_URL: host=localhost user=postgres password=postgres

  e2e-mysql:
    name: E2E MySQL
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: esql_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: E2E tests
        run: cargo test -p e2e-mysql
        env:
          MYSQL_URL: mysql://root:root@localhost/esql_test
